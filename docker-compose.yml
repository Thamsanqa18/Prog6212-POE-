services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RaceDay_Dev!2026Strong}"
    ports:
      - "1433:1433"
    volumes:
      - racedaysqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

  api:
    build:
      context: ./RaceDay.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RaceDayDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RaceDay_Dev!2026Strong};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=true"
      Registration__OrganiserCode: "${ORGANISER_CODE:-RACEDAY-ORGANISER-2026}"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
      AzureBlobStorage__ContainerName: "raceday-media"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"

  mvc:
    build:
      context: ./RaceDay.Mvc
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: "http://api:8080/"
    depends_on:
      - api
    ports:
      - "8081:8080"

volumes:
  racedaysqldata:
